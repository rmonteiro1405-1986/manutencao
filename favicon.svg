<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Speedometer Dial Gradient (Voyage Blue to Crosser Amber) -->
    <linearGradient id="dialGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Wrench Silver/Blue Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Glowing Needle Gradient -->
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Subtle Neon Border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Outer Dashboard Dial Track -->
  <circle cx="256" cy="270" r="170" fill="none" stroke="#1E293B" stroke-width="32" stroke-dasharray="800" stroke-dashoffset="240" stroke-linecap="round" />
  
  <!-- Active Tachometer Arc (Blue -> Gold/Amber) -->
  <circle cx="256" cy="270" r="170" fill="none" stroke="url(#dialGrad)" stroke-width="32" stroke-dasharray="800" stroke-dashoffset="360" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="256" cy="270" r="170" fill="none" stroke="url(#dialGrad)" stroke-width="28" stroke-dasharray="800" stroke-dashoffset="360" stroke-linecap="round" />

  <!-- Speedometer Hash Marks -->
  <!-- Mark 1 (Low speed) -->
  <line x1="130" y1="340" x2="148" y2="328" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" />
  <!-- Mark 2 (Mid speed) -->
  <line x1="120" y1="230" x2="142" y2="235" stroke="#60A5FA" stroke-width="6" stroke-linecap="round" />
  <!-- Mark 3 (Peak speed) -->
  <line x1="190" y1="140" x2="202" y2="160" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
  <!-- Mark 4 (High) -->
  <line x1="290" y1="120" x2="295" y2="144" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
  <!-- Mark 5 (Max) -->
  <line x1="380" y1="175" x2="362" y2="192" stroke="#EF4444" stroke-width="6" stroke-linecap="round" />

  <!-- Stylized Vehicle Car Silhouette (Voyage) - Top Left -->
  <g transform="translate(145, 185) scale(0.85)" opacity="0.95">
    <!-- Sleek Car Roof and Body -->
    <path d="M 30 50 Q 55 18 100 18 Q 140 18 165 50 L 195 58 Q 205 60 205 72 L 205 82 Q 205 88 195 88 L 5 88 Q -5 88 -5 82 L -5 72 Q -5 60 5 58 Z" fill="#3B82F6" />
    <!-- Windshield -->
    <path d="M 45 48 Q 65 24 100 24 Q 130 24 150 48 Z" fill="#0F172A" opacity="0.9" />
    <!-- Headlights -->
    <circle cx="10" cy="74" r="6" fill="#60A5FA" />
    <circle cx="190" cy="74" r="6" fill="#60A5FA" />
  </g>

  <!-- Stylized Motorcycle Silhouette (Crosser) - Bottom Right -->
  <g transform="translate(245, 275) scale(0.85)" opacity="0.95">
    <!-- Wheels -->
    <circle cx="20" cy="70" r="22" fill="none" stroke="#F59E0B" stroke-width="8" />
    <circle cx="150" cy="70" r="22" fill="none" stroke="#F59E0B" stroke-width="8" />
    <!-- Moto Frame & Tank -->
    <path d="M 20 70 L 60 40 L 95 35 L 125 50 L 150 70 M 60 40 L 90 70 L 150 70 M 95 35 L 75 15 L 60 18" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Rider / Handlebar Accent -->
    <circle cx="80" cy="12" r="5" fill="#F59E0B" />
  </g>

  <!-- Central Mechanic Wrench (Maintenance Symbol) -->
  <g transform="translate(256, 270) rotate(-45)">
    <!-- Wrench Shaft -->
    <rect x="-14" y="-85" width="28" height="170" rx="8" fill="url(#metalGrad)" stroke="#1E293B" stroke-width="3" />
    <!-- Wrench Top Head -->
    <path d="M -30 -80 C -40 -105 -15 -135 10 -135 C 35 -135 60 -105 50 -80 C 45 -70 35 -65 25 -65 L 12 -90 L -12 -90 L -25 -65 C -35 -65 -45 -70 -30 -80 Z" fill="url(#metalGrad)" stroke="#1E293B" stroke-width="3" />
    <!-- Center Bolt Hole in Shaft -->
    <circle cx="0" cy="0" r="10" fill="#0F172A" />
  </g>

  <!-- Speedometer Center Hub & Needle -->
  <circle cx="256" cy="270" r="28" fill="#1E293B" stroke="#334155" stroke-width="4" />
  <circle cx="256" cy="270" r="14" fill="#F59E0B" />
  <!-- Dynamic Needle pointing to 1:30 PM (Power/Maintenance Peak) -->
  <polygon points="253,270 259,270 262,130 256,115 250,130" fill="url(#needleGrad)" filter="url(#glow)" />
  <polygon points="253,270 259,270 262,130 256,115 250,130" fill="url(#needleGrad)" />

  <!-- Bottom App Name Subtle Monogram -->
  <text x="256" y="455" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#F1F5F9" letter-spacing="4" text-anchor="middle">
    AUTOGESTÃO
  </text>
  <text x="256" y="480" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#64748B" letter-spacing="3" text-anchor="middle">
    GARAGEM UNIFICADA
  </text>
</svg>
